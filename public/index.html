<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodingPlan 用量监控</title>
  <style>
    /* ============ 玻璃拟态仪表盘 · Glassmorphism Dashboard（三主题:亮色 / 暗色 / Claude）============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #7c3aed;
      --accent-2: #0ea5e9;
      --accent-3: #6366f1;
      --accent-grad: linear-gradient(120deg, #0ea5e9 0%, #6366f1 50%, #8b5cf6 100%);
      --accent-soft: rgba(124,58,237,.12);
      --accent-soft-bd: rgba(124,58,237,.3);
      --accent-glow: rgba(124,58,237,.32);

      --glass: rgba(255,255,255,.82);
      --glass-strong: rgba(255,255,255,.95);
      --glass-soft: rgba(255,255,255,.55);
      --glass-border: rgba(255,255,255,.72);
      --glass-border-soft: rgba(255,255,255,.42);
      --glass-shadow: 0 1px 2px rgba(15,23,42,.05), 0 10px 30px rgba(15,23,42,.09);
      --glass-shadow-hover: 0 4px 14px rgba(79,70,229,.12), 0 18px 44px rgba(79,70,229,.18);
      --blur: 12px;

      --text: #1e293b;
      --text-soft: #475569;
      --text-mute: #94a3b8;
      --text-faint: #b0bccf;

      --line: rgba(148,163,184,.24);
      --track: rgba(148,163,184,.24);
      --dot: rgba(100,116,139,.08);

      --ok: #16a34a;      --ok-bg: rgba(22,163,74,.14);    --ok-bd: rgba(22,163,74,.3);
      --warn: #d97706;    --warn-bg: rgba(217,119,6,.14);   --warn-bd: rgba(217,119,6,.3);
      --danger: #e11d48;  --danger-bg: rgba(225,29,72,.13);  --danger-bd: rgba(225,29,72,.3);
      --exh: #c026d3;     --exh-bg: rgba(192,38,211,.15);   --exh-bd: rgba(192,38,211,.32);

      --header-bg: linear-gradient(120deg, rgba(2,132,199,.92), rgba(99,102,241,.9) 50%, rgba(124,58,237,.92));
      --header-text: #fff;
      --header-border: rgba(255,255,255,.25);
      --header-shadow: 0 6px 30px rgba(99,102,241,.28);
      --header-ctl-bg: rgba(255,255,255,.16);
      --header-ctl-border: rgba(255,255,255,.28);
      --header-ctl-text: rgba(255,255,255,.9);
      --header-ctl-hover: rgba(255,255,255,.3);
      --header-ctl-active-bg: rgba(255,255,255,.95);
      --header-ctl-active-text: var(--accent);
      --header-dot: linear-gradient(135deg, #67e8f9, #ddd6fe);
      --header-dot-glow: rgba(167,139,250,.9);

      --radius: 18px;
      --radius-sm: 12px;
    }

    :root.dark {
      --accent: #a78bfa;
      --accent-2: #38bdf8;
      --accent-3: #818cf8;
      --accent-soft: rgba(167,139,250,.15);
      --accent-soft-bd: rgba(167,139,250,.34);
      --accent-glow: rgba(124,58,237,.4);

      --glass: rgba(255,255,255,.07);
      --glass-strong: rgba(255,255,255,.11);
      --glass-soft: rgba(255,255,255,.05);
      --glass-border: rgba(255,255,255,.15);
      --glass-border-soft: rgba(255,255,255,.09);
      --glass-shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.45);
      --glass-shadow-hover: 0 4px 14px rgba(124,58,237,.24), 0 18px 48px rgba(124,58,237,.34);

      --text: #e2e8f0;
      --text-soft: #cbd5e1;
      --text-mute: #7c89a3;
      --text-faint: #565f75;

      --line: rgba(148,163,184,.16);
      --track: rgba(148,163,184,.16);
      --dot: rgba(148,163,184,.07);

      --ok: #4ade80;   --ok-bg: rgba(74,222,128,.14);  --ok-bd: rgba(74,222,128,.28);
      --warn: #fbbf24; --warn-bg: rgba(251,191,36,.14); --warn-bd: rgba(251,191,36,.3);
      --danger: #fb7185; --danger-bg: rgba(251,113,133,.14); --danger-bd: rgba(251,113,133,.3);
      --exh: #e879f9;  --exh-bg: rgba(232,121,249,.16); --exh-bd: rgba(232,121,249,.32);

      --header-bg: linear-gradient(120deg, rgba(8,47,73,.92), rgba(49,46,129,.92) 50%, rgba(76,29,149,.92));
      --header-shadow: 0 6px 30px rgba(0,0,0,.5);
    }

    /* Claude 主题:暖羊皮纸底 + 陶土橙点缀 */
    :root.claude {
      --accent: #c15f3c;
      --accent-2: #8a6d3b;
      --accent-3: #9a5b33;
      --accent-grad: linear-gradient(120deg, #d97748 0%, #c05b36 55%, #a84e2e 100%);
      --accent-soft: rgba(193,95,60,.12);
      --accent-soft-bd: rgba(193,95,60,.32);
      --accent-glow: rgba(193,95,60,.28);

      --glass: rgba(252,250,243,.9);
      --glass-strong: rgba(253,251,246,.97);
      --glass-soft: rgba(255,255,255,.6);
      --glass-border: rgba(216,201,172,.55);
      --glass-border-soft: rgba(148,128,94,.22);
      --glass-shadow: 0 1px 2px rgba(92,74,46,.05), 0 10px 30px rgba(92,74,46,.1);
      --glass-shadow-hover: 0 4px 14px rgba(163,92,52,.14), 0 18px 44px rgba(163,92,52,.2);

      --text: #2c2a25;
      --text-soft: #57534a;
      --text-mute: #8a8474;
      --text-faint: #b3ab99;

      --line: rgba(122,106,75,.18);
      --track: rgba(122,106,75,.2);
      --dot: rgba(120,100,70,.09);

      --ok: #3f7a4e;   --ok-bg: rgba(76,140,90,.13);   --ok-bd: rgba(76,140,90,.32);
      --warn: #a16207; --warn-bg: rgba(180,120,20,.13); --warn-bd: rgba(180,120,20,.32);
      --danger: #b3372f; --danger-bg: rgba(190,60,50,.11); --danger-bd: rgba(190,60,50,.3);
      --exh: #8a4a9e;  --exh-bg: rgba(150,80,170,.12);  --exh-bd: rgba(150,80,170,.3);

      --header-bg: linear-gradient(120deg, rgba(240,235,222,.94), rgba(234,226,207,.94) 50%, rgba(238,230,212,.94));
      --header-text: #2c2a25;
      --header-border: rgba(122,106,75,.18);
      --header-shadow: 0 6px 24px rgba(122,94,60,.14);
      --header-ctl-bg: rgba(44,42,37,.05);
      --header-ctl-border: rgba(44,42,37,.16);
      --header-ctl-text: #3d3929;
      --header-ctl-hover: rgba(44,42,37,.1);
      --header-ctl-active-bg: #fffdf8;
      --header-ctl-active-text: #c15f3c;
      --header-dot: linear-gradient(135deg, #e5986d, #c15f3c);
      --header-dot-glow: rgba(193,95,60,.7);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--text);
      min-height: 100vh;
      background-color: #eef2fa;
      background-image:
        radial-gradient(var(--dot) 1px, transparent 1.4px),
        radial-gradient(900px 620px at 8% -6%, rgba(14,165,233,.2), transparent 60%),
        radial-gradient(1000px 700px at 96% 4%, rgba(139,92,246,.22), transparent 60%),
        radial-gradient(820px 820px at 60% 112%, rgba(236,72,153,.1), transparent 55%);
      background-size: 26px 26px, auto, auto, auto;
      background-attachment: fixed;
    }
    :root.dark body {
      background-color: #070b18;
      background-image:
        radial-gradient(var(--dot) 1px, transparent 1.4px),
        radial-gradient(900px 620px at 8% -6%, rgba(14,165,233,.2), transparent 60%),
        radial-gradient(1000px 700px at 96% 4%, rgba(139,92,246,.26), transparent 60%),
        radial-gradient(820px 820px at 60% 112%, rgba(236,72,153,.14), transparent 55%);
      background-size: 26px 26px, auto, auto, auto;
    }
    :root.claude body {
      background-color: #f0ede3;
      background-image:
        radial-gradient(var(--dot) 1px, transparent 1.4px),
        radial-gradient(900px 620px at 8% -6%, rgba(193,95,60,.13), transparent 60%),
        radial-gradient(1000px 700px at 96% 4%, rgba(138,109,59,.13), transparent 60%),
        radial-gradient(820px 820px at 60% 112%, rgba(163,132,87,.11), transparent 55%);
      background-size: 26px 26px, auto, auto, auto;
    }

    /* ===== 顶栏：主题渐变玻璃 ===== */
    .header {
      background: var(--header-bg);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      color: var(--header-text);
      padding: 16px 30px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--header-border);
      box-shadow: var(--header-shadow);
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
    .header h1::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--header-dot); box-shadow: 0 0 12px var(--header-dot-glow); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-btn { background: var(--header-ctl-bg); border: 1px solid var(--header-ctl-border); color: var(--header-text); padding: 7px 18px; border-radius: 9px; cursor: pointer; font-size: 13px; transition: background .2s, transform .15s; text-decoration: none; }
    .header-btn:hover { background: var(--header-ctl-hover); }
    .header-btn:active { transform: scale(.97); }
    .last-updated { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }

    .container { margin: 24px auto; padding: 0 24px; }

    /* ===== 工具栏：玻璃条 ===== */
    .toolbar { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 12px 18px;
      background: var(--glass); backdrop-filter: blur(var(--blur)) saturate(150%); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
      border: 1px solid var(--glass-border); border-radius: var(--radius-sm); box-shadow: var(--glass-shadow); margin-bottom: 18px; }
    .toolbar-group { display: flex; align-items: center; gap: 6px; }
    .toolbar-label { font-size: 12px; color: var(--text-mute); margin-right: 2px; }
    .toolbar-btn { padding: 5px 15px; border: 1px solid var(--glass-border-soft); border-radius: 18px; background: var(--glass-soft); cursor: pointer; font-size: 12px; color: var(--text-soft); transition: all .15s; display: inline-flex; align-items: center; gap: 4px; }
    .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar-btn.active { background: var(--accent-grad); border-color: transparent; color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
    .sort-arrow { font-size: 9px; line-height: 1; opacity: .85; }
    .toolbar-count { margin-left: auto; font-size: 12px; color: var(--text-mute); }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

    /* ===== 管理员右侧:中转站实时活动面板 ===== */
    .main-layout { display: flex; gap: 16px; align-items: flex-start; }
    .main-col { flex: 1; min-width: 0; }
    .activity-panel { width: 300px; flex-shrink: 0; position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; }
    /* 折叠时宽度收缩为展开按钮自身,把空间让给左侧卡片区 */
    .activity-panel.collapsed { width: auto; flex: 0 0 auto; }
    .activity-panel.collapsed .activity-card { display: none; }
    .activity-card { display: flex; flex-direction: column; min-height: 0; max-height: calc(100vh - 24px);
      background: var(--glass); backdrop-filter: blur(var(--blur)) saturate(150%); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
      border: 1px solid var(--glass-border); border-radius: var(--radius); box-shadow: var(--glass-shadow); overflow: hidden; }
    .activity-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--glass-border-soft); }
    .activity-title { font-size: 14px; font-weight: 650; color: var(--text); white-space: nowrap; }
    .activity-time { font-size: 11px; color: var(--text-faint); margin-left: auto; white-space: nowrap; }
    .activity-time.stale { color: #f5222d; }
    .activity-fold { border: 1px solid var(--glass-border-soft); background: var(--glass-soft); color: var(--text-mute);
      width: 22px; height: 22px; border-radius: 7px; cursor: pointer; font-size: 13px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .activity-fold:hover { color: var(--text); }
    .activity-expand-tab { writing-mode: vertical-rl; letter-spacing: 4px; padding: 14px 6px; border-radius: var(--radius-sm);
      background: var(--glass); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); color: var(--text-soft);
      font-size: 12px; cursor: pointer; align-self: flex-start; }
    .activity-expand-tab:hover { color: var(--text); border-color: var(--accent-soft-bd); }
    .activity-scroll { overflow-y: auto; padding: 12px 14px 14px; }
    .activity-sub { font-size: 12px; font-weight: 600; color: var(--text-soft); margin: 2px 0 8px; display: flex; align-items: baseline; gap: 6px; }
    .activity-sub + .activity-sub, #activityRankList + .activity-sub { margin-top: 14px; }
    .activity-sub-extra { font-size: 11px; font-weight: 400; color: var(--text-faint); }
    .activity-empty { font-size: 12px; color: var(--text-faint); padding: 6px 0 2px; }
    .activity-error { font-size: 12px; color: #f5222d; padding: 6px 0 2px; }
    .dp-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--glass-border-soft); }
    .dp-row:last-child { border-bottom: none; }
    .dp-name { font-size: 13px; font-weight: 550; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
    .dp-blocks { display: flex; flex-wrap: wrap; gap: 3px; flex-shrink: 0; }
    .dp-block { width: 13px; height: 13px; border-radius: 3.5px; cursor: default; }
    .dp-block.unknown { background: var(--text-faint); opacity: .4; }
    .dp-wait { font-size: 11px; color: #f5222d; background: rgba(245,34,45,.1); border-radius: 9px; padding: 2px 7px; white-space: nowrap; flex-shrink: 0; }
    .dp-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 7px 0 2px; border-top: 1px dashed var(--glass-border-soft); margin-top: 4px; }
    .dp-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-mute); max-width: 100%; }
    .dp-legend-item i { width: 9px; height: 9px; border-radius: 2.5px; flex-shrink: 0; }
    .dp-legend-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    :root.dark .dp-wait { background: rgba(245,34,45,.2); color: #ff7875; }
    :root.claude .dp-wait { background: rgba(160,60,50,.14); color: #a03c32; }
    .rank-row { padding: 6px 0 7px; }
    .rank-row + .rank-row { border-top: 1px dashed var(--glass-border-soft); }
    .rank-line { display: flex; align-items: baseline; gap: 7px; }
    .rank-no { font-size: 11px; font-weight: 700; color: var(--text-faint); width: 14px; flex-shrink: 0; font-style: italic; }
    .rank-no.top { color: var(--accent); }
    .rank-name { font-size: 12.5px; font-weight: 550; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .rank-val { font-size: 12px; font-weight: 650; color: var(--text); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .rank-cost { font-size: 10.5px; color: var(--text-faint); margin-left: 6px; font-weight: 400; white-space: nowrap; }
    .rank-bar { display: flex; gap: 2px; height: 5px; margin-top: 5px; }
    .rank-bar-seg { height: 100%; border-radius: 2px; min-width: 2px; flex-shrink: 0; }
    .rank-ext { font-size: 10px; color: var(--text-mute); background: var(--glass-soft); border: 1px solid var(--glass-border-soft);
      border-radius: 7px; padding: 1px 5px; margin-left: 5px; font-weight: 400; white-space: nowrap; }
    .activity-refresh { margin-left: auto; border: 1px solid var(--glass-border-soft); background: var(--glass-soft); color: var(--text-mute);
      width: 20px; height: 20px; border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .activity-refresh:hover { color: var(--text); }
    .activity-refresh.spinning { animation: activity-spin .8s linear infinite; }
    @keyframes activity-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .activity-more { display: block; width: 100%; margin-top: 10px; padding: 6px 0; border: 1px solid var(--glass-border-soft);
      border-radius: 9px; background: var(--glass-soft); color: var(--text-soft); font-size: 12px; cursor: pointer; }
    .activity-more:hover { color: var(--text); border-color: var(--accent-soft-bd); }

    /* ===== 卡片 ===== */
    .card { position: relative; background: var(--glass); backdrop-filter: blur(var(--blur)) saturate(150%); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
      border: 1px solid var(--glass-border); border-radius: var(--radius); box-shadow: var(--glass-shadow); overflow: hidden;
      transition: transform .2s, box-shadow .2s, border-color .2s; display: flex; flex-direction: column; }
    .card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); pointer-events: none; }
    .card:hover { transform: translateY(-3px); box-shadow: var(--glass-shadow-hover); border-color: var(--accent-soft-bd); }

    .card-header { padding: 9px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .card-header-left { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
    .card-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .card-header h3 { font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .card-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .platform-tag { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; flex-shrink: 0; letter-spacing: .3px; }
    .platform-glm { background: rgba(14,165,233,.16); color: #0369a1; border: 1px solid rgba(14,165,233,.3); }
    .platform-yescode { background: rgba(22,163,74,.16); color: #15803d; border: 1px solid rgba(22,163,74,.3); }
    .platform-huoli { background: rgba(217,119,6,.16); color: #b45309; border: 1px solid rgba(217,119,6,.3); }
    .platform-sub2api { background: rgba(217,119,6,.16); color: #b45309; border: 1px solid rgba(217,119,6,.3); }
    .platform-volc { background: rgba(13,148,136,.16); color: #0f766e; border: 1px solid rgba(13,148,136,.3); }
    .platform-volcc { background: rgba(124,58,237,.16); color: #6d28d9; border: 1px solid rgba(124,58,237,.3); }
    .platform-telecomjs { background: rgba(225,29,72,.15); color: #be123c; border: 1px solid rgba(225,29,72,.3); }
    .platform-qwen { background: rgba(219,39,119,.15); color: #be185d; border: 1px solid rgba(219,39,119,.3); }
    .platform-minimax { background: rgba(202,138,4,.16); color: #a16207; border: 1px solid rgba(202,138,4,.3); }
    .platform-stepfun { background: rgba(79,70,229,.16); color: #4338ca; border: 1px solid rgba(79,70,229,.3); }
    :root.dark .platform-glm { background: rgba(56,189,248,.16); color: #7dd3fc; border-color: rgba(56,189,248,.3); }
    :root.dark .platform-yescode { background: rgba(74,222,128,.16); color: #86efac; border-color: rgba(74,222,128,.3); }
    :root.dark .platform-huoli { background: rgba(251,191,36,.16); color: #fcd34d; border-color: rgba(251,191,36,.3); }
    :root.dark .platform-sub2api { background: rgba(251,191,36,.16); color: #fcd34d; border-color: rgba(251,191,36,.3); }
    :root.dark .platform-volc { background: rgba(45,212,191,.16); color: #5eead4; border-color: rgba(45,212,191,.3); }
    :root.dark .platform-volcc { background: rgba(167,139,250,.16); color: #c4b5fd; border-color: rgba(167,139,250,.3); }
    :root.dark .platform-telecomjs { background: rgba(251,113,133,.16); color: #fda4af; border-color: rgba(251,113,133,.3); }
    :root.dark .platform-qwen { background: rgba(244,114,182,.16); color: #f9a8d4; border-color: rgba(244,114,182,.3); }
    :root.dark .platform-minimax { background: rgba(250,204,21,.16); color: #fde047; border-color: rgba(250,204,21,.3); }
    :root.dark .platform-stepfun { background: rgba(165,180,252,.16); color: #a5b4fc; border-color: rgba(165,180,252,.3); }

    .card-status { font-size: 12px; padding: 2px 11px; border-radius: 11px; font-weight: 600; }
    .status-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-bd); }
    .status-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-bd); }
    .status-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-bd); }
    .status-exhausted { background: var(--exh-bg); color: var(--exh); border: 1px solid var(--exh-bd); }
    .status-error { background: var(--glass-soft); color: var(--text-mute); border: 1px solid var(--glass-border-soft); }
    .status-loading { background: var(--accent-soft); color: var(--accent-3); }

    .card-refresh { background: none; border: none; cursor: pointer; color: var(--text-mute); padding: 6px 8px; border-radius: 8px; font-size: 20px; transition: color .2s, background .2s; line-height: 1; }
    .card-refresh:hover { color: var(--accent); background: var(--glass-soft); }
    .card-refresh.spinning { animation: spin .8s linear infinite; color: var(--accent); }

    .card-body { padding: 16px 20px; flex: 1; }

    .limit-row { margin-bottom: 14px; }
    .limit-row:last-child { margin-bottom: 0; }

    .weight-badge.w-high { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
    /* sub2api 容量胶囊：当前调度中|总容量；悬浮明细用全局 fixed 气泡（#capTip），
       避免 .card 的 overflow:hidden 裁剪。idle 态用实色边框，避免与卡片背景融为一体。 */
    .cap-pill { padding: 1px 9px; border-radius: 11px; font-size: 11px; font-weight: 700; border: 1px solid var(--line); background: var(--glass-soft); color: var(--text-soft); white-space: nowrap; flex-shrink: 0; cursor: help; user-select: none; font-variant-numeric: tabular-nums; }
    .cap-pill.busy { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bd); }
    .cap-pill.full { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-bd); }
    #capTip { display: none; position: fixed; z-index: 9999; white-space: pre-line; text-align: left;
      background: rgba(28, 30, 36, 0.97); color: #e8eaed; border: 1px solid rgba(255,255,255,0.14);
      padding: 8px 11px; border-radius: 9px; font-size: 12px; font-weight: 400; line-height: 1.7;

    .risk-badge { padding: 1px 8px; border-radius: 11px; font-size: 11px; font-weight: 700; background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-bd); cursor: help; white-space: nowrap; flex-shrink: 0; }
    .reset-badge { padding: 1px 8px; border-radius: 11px; font-size: 11px; font-weight: 700; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-bd); cursor: help; white-space: nowrap; flex-shrink: 0; }
    .resetcard-badge { padding: 1px 8px; border-radius: 11px; font-size: 11px; font-weight: 700; background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-bd); cursor: help; white-space: nowrap; flex-shrink: 0; }
    .use-card-btn { padding: 2px 10px; margin-left: 8px; border-radius: 7px; border: 1px solid var(--ok-bd); background: var(--ok-bg); color: var(--ok); cursor: pointer; font-size: 11px; font-weight: 600; vertical-align: 1px; }

    /* ===== Modal ===== */

    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

    .info-section { margin-bottom: 20px; }

    .keys-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }

    .loading { display: flex; flex-direction: column; align-items: center; padding: 80px; color: var(--text-mute); }

    .card-loading-body { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 8px; min-height: 88px; }
    .skel-line { height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--glass-soft) 25%, var(--glass-border-soft) 37%, var(--glass-soft) 63%); background-size: 400% 100%; animation: skel 1.2s ease-in-out infinite; }

    .detail-tab:hover { color: var(--accent); }
    .detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 650; }

    /* ===== List View ===== */

    .list-row { position: relative; background: var(--glass); backdrop-filter: blur(var(--blur)) saturate(150%); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); border: 1px solid var(--glass-border); border-radius: var(--radius); box-shadow: var(--glass-shadow); padding: 12px 18px; padding-right: 40px; display: flex; align-items: center; gap: 18px; transition: transform .2s, box-shadow .2s, border-color .2s; cursor: pointer; }
    .list-row:hover { transform: translateY(-2px); box-shadow: var(--glass-shadow-hover); border-color: var(--accent-soft-bd); }
    .list-row-refresh { position: absolute; top: 8px; right: 8px; z-index: 2; font-size: 16px; padding: 3px 6px; }
    .list-row-left { display: flex; flex-direction: column; gap: 5px; width: 170px; min-width: 170px; flex-shrink: 0; }
    .list-row-title { display: flex; align-items: center; gap: 7px; }
    .list-row-title h3 { font-size: 14px; font-weight: 650; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row-status { display: flex; align-items: center; gap: 6px; }
    .list-row-status .card-status { font-size: 11px; padding: 1px 8px; }

    .list-rings { display: flex; gap: 14px; align-items: flex-start; flex: 1; min-width: 0; flex-wrap: wrap; }
    .ring-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .ring { position: relative; width: 76px; height: 76px; }
    .ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); overflow: visible; }
    .ring-track { fill: none; stroke: var(--track); stroke-width: 4; }
    .ring-fill { fill: none; stroke: #16a34a; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 106.814; stroke-dashoffset: calc(106.814 * (1 - var(--pct, 0) / 100)); transition: stroke-dashoffset .6s ease; }
    .ring-fill.ring-orange { stroke: #d97706; }
    .ring-fill.ring-red { stroke: #e11d48; }
    .ring-fill.ring-exhausted { stroke: #c026d3; }
    :root.dark .ring-fill { stroke: #4ade80; }
    :root.dark .ring-fill.ring-orange { stroke: #fbbf24; }
    :root.dark .ring-fill.ring-red { stroke: #fb7185; }
    :root.dark .ring-fill.ring-exhausted { stroke: #e879f9; }
    .ring-seg-tick { stroke: #fff; stroke-width: 1.4; }
    :root.dark .ring-seg-tick { stroke: #0b1020; }
    :root.claude .ring-seg-tick { stroke: #f7f3e8; }
    .ring-theo { stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; }
    .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.1; text-align: center; padding: 0 4px; }
    .ring-center .rc-label { font-size: 9px; font-weight: 600; color: var(--text-mute); white-space: nowrap; }
    .ring-center .rc-pct { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
    .ring-center .rc-value { font-size: 8px; color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

    .list-row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .list-row-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .list-row-meta .level-badge { font-size: 11px; padding: 1px 7px; }
    .list-row-meta .cache-time { font-size: 11px; }
    .list-row-expire { font-size: 11px; color: var(--text-faint); cursor: pointer; }
    .list-row-expire.expire-danger { color: var(--danger); font-weight: 600; }
    .list-row-error { color: var(--danger); font-size: 13px; }

    /* 窄屏:右侧实时面板改为整宽堆叠在卡片下方(sticky 取消) */
    @media (max-width: 1100px) {
      .main-layout { flex-direction: column; }
      .activity-panel { width: 100%; position: static; }
      .activity-card { max-height: 420px; }
      .activity-expand-tab { writing-mode: horizontal-tb; letter-spacing: 2px; width: 100%; padding: 8px 0; }
    }

    @media (max-width: 768px) {
      .header { padding: 14px 16px; }
      .header h1 { font-size: 17px; }
      .header-right { gap: 6px; }
      .last-updated { display: none; }
      .header-btn { padding-left: 10px; padding-right: 10px; }
      .container { padding: 0 12px; margin: 16px auto; }
      .card-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .list-row { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 14px; }
      .list-row-left { width: auto; min-width: 0; }
      .list-row-right { align-items: flex-start; }
    }

    /* ===== Privacy toggle / theme picker ===== */
    .dark-toggle { background: var(--header-ctl-bg); border: 1px solid var(--header-ctl-border); cursor: pointer; color: var(--header-ctl-text); font-size: 18px; width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; transition: background .2s; }
    .dark-toggle:hover { background: var(--header-ctl-hover); }
    .dark-toggle svg { width: 18px; height: 18px; }
    .dark-toggle.active { background: var(--header-ctl-hover); box-shadow: inset 0 0 0 1.5px var(--header-ctl-border); }

    .theme-picker { position: relative; }
    .theme-picker-btn { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 9px; background: var(--header-ctl-bg); border: 1px solid var(--header-ctl-border); color: var(--header-ctl-text); cursor: pointer; font-size: 12.5px; font-family: inherit; transition: background .2s; }
    .theme-picker-btn:hover { background: var(--header-ctl-hover); }
    .theme-picker-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .theme-picker-btn .tp-caret { width: 12px; height: 12px; opacity: .7; }
    .theme-menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 138px; padding: 5px; border-radius: 12px; background: var(--glass-strong); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow-hover); opacity: 0; visibility: hidden; transform: translateY(-4px) scale(.98); transition: opacity .15s, transform .15s, visibility .15s; z-index: 200; }
    .theme-menu.open { opacity: 1; visibility: visible; transform: none; }
    .theme-menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 10px; border: none; background: none; border-radius: 8px; font-size: 13px; font-family: inherit; color: var(--text-soft); cursor: pointer; transition: background .12s, color .12s; }
    .theme-menu button:hover { background: var(--glass-soft); color: var(--text); }
    .theme-menu button.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .theme-menu button svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* ===== Theme transition (View Transitions API) ===== */
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 500ms; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
    ::view-transition-old(root) { animation: none; z-index: 1; }
    ::view-transition-new(root) { animation: theme-grow 500ms cubic-bezier(0.4, 0, 0.2, 1); z-index: 2; }
    @keyframes theme-grow {
      from { clip-path: circle(0% at var(--theme-x) var(--theme-y)); }
      to   { clip-path: circle(150% at var(--theme-x) var(--theme-y)); }
    }
    .theme-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; pointer-events: none; }
  </style>
  <script src="js/echart/echarts.min.js"></script>
  <script>
    // 子路径部署适配:页面挂在路径前缀下(如 https://host/glm/)时,
    // 同源后端 API 请求需要带上相同前缀;直接挂根路径则前缀为空,行为不变。
    var API_PREFIX = (function () {
      var parts = location.pathname.split('/');
      if (parts.length < 3 || !parts[1]) return '';
      return '/' + parts[1];
    })();
    // 可选集成功能开关(启动时从 /api/features 拉取;拉取失败按未启用处理,
    // 安全默认:中转站面板/容量胶囊不渲染、不轮询)
    var FEATURES = { relayEnabled: false };
    // 首帧前应用主题,避免闪烁;兼容旧键 usage_dark(true → dark)
    (function(){
      var t = localStorage.getItem('usage_theme');
      if (t !== 'light' && t !== 'dark' && t !== 'claude') {
        t = localStorage.getItem('usage_dark') === 'true' ? 'dark' : 'light';
      }
      if (t !== 'light') document.documentElement.classList.add(t);
    })();
  </script>
</head>
<body>
  <div class="header">
    <h1>CodingPlan 用量监控</h1>
    <div class="header-right">
      <div class="view-toggle" id="viewToggle">
        <button class="view-btn active" data-view="block" onclick="setViewMode('block')" title="卡片视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </button>
        <button class="view-btn" data-view="list" onclick="setViewMode('list')" title="列表视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
        </button>
      </div>
      <div class="theme-picker" id="themePicker">
        <button class="theme-picker-btn" id="themePickerBtn" title="切换主题">
          <span id="themePickerIcon"></span>
          <span id="themePickerLabel">亮色</span>
          <svg class="tp-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="theme-menu" id="themeMenu" role="menu"></div>
      </div>
      <button class="dark-toggle" id="privacyToggle" title="切换隐私模式（隐藏账号名称）">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
      <span class="last-updated" id="lastUpdated"></span>
      <a class="header-btn" href="./models.html">模型调用</a>
      <button class="header-btn" id="mgmtBtn">管理账号</button>
      <button class="header-btn" id="refreshBtn" style="display: none;">全部刷新</button>
    </div>
  </div>
  <div class="container">
    <div class="main-layout">
      <div class="main-col">
        <div class="toolbar" id="toolbar">
          <div class="toolbar-group" id="platformFilterGroup">
            <span class="toolbar-label">站点</span>
            <button class="toolbar-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
            <span id="platformFilters"></span>
          </div>
          <div class="toolbar-group">
            <span class="toolbar-label">排序</span>
            <button class="toolbar-btn active" data-sort="default" onclick="setSort('default')">默认</button>
            <button class="toolbar-btn" data-sort="dispatch" onclick="setSort('dispatch')">调度量<span class="sort-arrow" id="dispatchArrow">▼</span></button>
            <button class="toolbar-btn" data-sort="tension" onclick="setSort('tension')">紧张度<span class="sort-arrow" id="tensionArrow">▼</span></button>
            <button class="toolbar-btn" data-sort="weight" onclick="setSort('weight')">权重<span class="sort-arrow" id="weightArrow">▼</span></button>
          </div>
          <span class="toolbar-count" id="toolbarCount"></span>
        </div>
        <div class="card-grid" id="cardGrid"></div>
      </div>
      <!-- 管理员专属:中转站用户实时调度 + 今日Token 排行(默认隐藏,登录后显示) -->
      <aside class="activity-panel" id="activityPanel" style="display:none">
        <div class="activity-card">
          <div class="activity-head">
            <span class="activity-title">中转站实时</span>
            <span class="activity-time" id="activityTime"></span>
            <button class="activity-fold" id="activityFoldBtn" onclick="toggleActivityPanel()" title="收起面板">‹</button>
          </div>
          <div class="activity-scroll" id="activityScroll">
            <div class="activity-sub">实时调度 <span class="activity-sub-extra" id="activityDispatchSummary"></span></div>
            <div id="activityDispatchList"></div>
            <div class="dp-legend" id="activityLegend" style="display:none"></div>
            <div class="activity-sub">今日 Token <span class="activity-sub-extra" id="activityTokenSummary"></span>
              <button class="activity-refresh" id="activityUsageRefreshBtn" onclick="loadActivityUsage(true)" title="立即刷新榜单(常规 5 分钟一次)">&#x21bb;</button>
            </div>
            <div id="activityRankList"></div>
            <button class="activity-more" id="activityMoreBtn" onclick="toggleActivityRankExpand()" style="display:none"></button>
          </div>
        </div>
        <button class="activity-expand-tab" id="activityExpandTab" onclick="toggleActivityPanel()" title="展开实时面板" style="display:none">
          <span>实时调度</span>
        </button>
      </aside>
    </div>
  </div>

  <div class="badge-tooltip" id="badgeTooltip" role="tooltip"></div>

  <!-- 密码验证 -->
  <div class="modal-overlay" id="pwdOverlay">
    <div class="modal" style="width:360px">
      <div class="modal-header">
        <h3>身份验证</h3>
        <button class="modal-close" onclick="closeModal('pwdOverlay')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">请输入管理密码</label>
          <input class="form-input" type="password" id="pwdInput">
        </div>
        <div id="pwdError" style="color:#f5222d;font-size:13px;min-height:18px"></div>
        <div class="form-actions"><button class="btn-primary" onclick="submitPassword()">确认</button></div>
      </div>
    </div>
  </div>

  <!-- 详情 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" style="width:calc(100vw - 50px);max-width:calc(100vw - 50px)">
      <div class="modal-header">
        <h3 id="modalTitle">账号详情</h3>
        <button class="modal-close" onclick="closeModal('modalOverlay')">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 管理 Modal -->
  <div class="modal-overlay" id="mgmtOverlay">
    <div class="modal" style="width:640px">
      <div class="modal-header">
        <h3 id="mgmtTitle">账号管理</h3>
        <button class="modal-close" onclick="closeModal('mgmtOverlay')">&times;</button>
      </div>
      <div class="modal-body" id="mgmtBody"></div>
    </div>
  </div>

  <!-- 智云登录 Modal -->
  <div class="modal-overlay" id="telecomLoginOverlay">
    <div class="modal" style="width:600px">
      <div class="modal-header">
        <h3>智云登录续期</h3>
        <button class="modal-close" onclick="closeModal('telecomLoginOverlay')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="telecom-phone-check" id="telecomPhoneCheck">
          <div class="form-group">
            <label class="form-label">账号登记手机号</label>
            <input class="form-input" id="telecomAccountPhone" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入 11 位手机号" onkeydown="if(event.key==='Enter')verifyTelecomAccountPhone()">
          </div>
          <div class="form-actions"><button class="btn-primary" id="telecomPhoneCheckBtn" onclick="verifyTelecomAccountPhone()">核对并继续</button></div>
        </div>
        <div id="telecomLoginOptions" style="display:none">
          <div class="telecom-qr-wrap">
            <img id="telecomQrImage" alt="智云官方登录二维码">
          </div>
        </div>
        <div class="telecom-login-status" id="telecomLoginStatus">请输入账号登记的手机号</div>
      </div>
    </div>
  </div>

  <!-- 权重配置 Modal -->
  <div class="modal-overlay" id="weightOverlay">
    <div class="modal" style="width:420px">
      <div class="modal-header">
        <h3>权重配置</h3>
        <button class="modal-close" onclick="closeModal('weightOverlay')">&times;</button>
      </div>
      <div class="modal-body" id="weightBody"></div>
    </div>
  </div>

  <!-- Theme transition overlay -->
  <div class="theme-overlay" id="themeOverlay"></div>

  <script src="js/app/telecom-login.js"></script>
