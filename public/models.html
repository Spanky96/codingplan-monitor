<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMax 模型调用</title>
  <link rel="stylesheet" href="models.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1>MiniMax 模型调用</h1>
    <span class="header-sub">对话 · 文生图 · 视频 · 语音合成</span>
  </div>
  <div class="header-right">
    <a class="header-btn" href="./">← 用量监控</a>
  </div>
</header>

<div class="container">

  <!-- 配置栏:API URL + Key,仅保存在浏览器本地 -->
  <div class="card config-bar">
    <div class="field grow">
      <label for="api_url">API URL</label>
      <input id="api_url" type="text" placeholder="https://lwai.05info.com:8887/v1(默认直连中转站;也可填 /minimax/v1 走内置反代)" autocomplete="off" spellcheck="false">
    </div>
    <div class="field grow">
      <label for="api_key">API Key(仅保存在浏览器本地,不上传服务器;默认中转站密钥)</label>
      <input id="api_key" type="password" placeholder="sk-...(默认已填中转站密钥)" autocomplete="off" spellcheck="false">
    </div>
    <div class="config-actions">
      <button class="btn-primary btn-sm" id="btn_save_config">保存配置</button>
      <span id="config_status" class="config-hint"></span>
    </div>
  </div>

  <!-- 模型选择 -->
  <div class="card">
    <div class="card-title">模型 <span class="badge" id="model_category_badge">对话</span></div>
    <div class="model-row">
      <div class="field">
        <label for="model_name">模型名称</label>
        <select id="model_name">
          <optgroup label="对话">
            <option value="MiniMax-Text-01">MiniMax-Text-01(对话,旗舰文本)</option>
            <option value="MiniMax-M3">MiniMax-M3(对话,最新)</option>
            <option value="MiniMax-M2.7-highspeed">MiniMax-M2.7-highspeed</option>
          </optgroup>
          <optgroup label="图像">
            <option value="image-01">image-01(文生图,旗舰)</option>
          </optgroup>
          <optgroup label="视频">
            <option value="MiniMax-Hailuo-02">MiniMax-Hailuo-02(视频 V1,图生视频)</option>
            <option value="MiniMax-H3">MiniMax-H3(视频 V2,需高级套餐)</option>
          </optgroup>
          <optgroup label="语音合成">
            <option value="speech-02-hd">speech-02-hd(语音合成,高清)</option>
            <option value="speech-02">speech-02(语音合成,标准)</option>
          </optgroup>
        </select>
      </div>
      <div class="field hidden" id="duration_field">
        <label for="duration">视频时长(秒)</label>
        <select id="duration"></select>
      </div>
      <div class="field hidden" id="resolution_field">
        <label for="resolution">分辨率</label>
        <select id="resolution"></select>
      </div>
    </div>
  </div>

  <!-- 输入参数 -->
  <div class="card">
    <div class="card-title">输入 <span class="badge" id="input_category_badge">对话</span></div>

    <!-- 对话 / 视频提示词 -->
    <div class="field" id="prompt_field">
      <label for="prompt" id="prompt_label">提示词</label>
      <textarea id="prompt" placeholder="输入提示词..."></textarea>
    </div>

    <!-- 视频参考图(由图片池勾选生成,无需手填 URL) -->
    <div class="field hidden" id="image_field">
      <div class="ref-head">
        <span class="seg hidden" id="video_mode_seg">
          <button type="button" class="seg-btn" data-mode="first_frame">首帧图 · ≤1 张</button>
          <button type="button" class="seg-btn" data-mode="reference">参考图 · ≤9 张</button>
        </span>
      </div>
      <label for="ref_display">参考图引用(由下方图片池勾选自动生成)</label>
      <input id="ref_display" type="text" readonly placeholder="尚未勾选图片 — 请在下方图片池中勾选">
      <div class="field-hint" id="video_mode_hint"></div>
    </div>

    <!-- 文生图参数 -->
    <div class="model-row hidden" id="image_row">
      <div class="field">
        <label for="aspect_ratio">画幅比例</label>
        <select id="aspect_ratio">
          <option value="1:1">1:1(正方形)</option>
          <option value="16:9">16:9(横屏)</option>
          <option value="9:16">9:16(竖屏)</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
        </select>
      </div>
      <div class="field">
        <label for="image_count">生成张数</label>
        <input id="image_count" type="number" value="1" min="1" max="8">
      </div>
    </div>

    <!-- 语音合成参数 -->
    <div class="model-row hidden" id="tts_row">
      <div class="field">
        <label for="voice_id">音色</label>
        <select id="voice_id">
          <option value="female-shaonv">female-shaonv(少女音)</option>
          <option value="male-qn-jingying">male-qn-jingying(精英男)</option>
          <option value="female-yujie">female-yujie(御姐)</option>
          <option value="male-qn-qingse">male-qn-qingse(清澈男)</option>
          <option value="presenter_male">presenter_male(主持人男)</option>
          <option value="presenter_female">presenter_female(主持人女)</option>
        </select>
      </div>
      <div class="field">
        <label for="tts_speed">语速 (0.5 ~ 2.0)</label>
        <input id="tts_speed" type="number" value="1.0" step="0.1" min="0.5" max="2.0">
      </div>
      <div class="field">
        <label for="tts_pitch">音调 (-12 ~ 12)</label>
        <input id="tts_pitch" type="number" value="0" step="1" min="-12" max="12">
      </div>
      <div class="field">
        <label for="tts_format">音频格式</label>
        <select id="tts_format">
          <option value="mp3">mp3</option>
          <option value="wav">wav</option>
          <option value="pcm">pcm</option>
        </select>
      </div>
    </div>

    <!-- 对话参数 -->
    <div class="model-row hidden" id="chat_row">
      <div class="field">
        <label for="max_tokens">max_tokens</label>
        <input id="max_tokens" type="number" value="1024" min="1" max="8192">
      </div>
      <div class="field">
        <label for="temperature">temperature (0 ~ 2)</label>
        <input id="temperature" type="number" value="0.7" step="0.05" min="0" max="2">
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="btn_generate">生成</button>
      <button class="btn-secondary hidden" id="btn_cancel">取消轮询</button>
      <span class="field-hint" id="status_hint"></span>
    </div>
  </div>

  <!-- 图片池:上传/生成的图片本地缓存,勾选后作为视频参考图 -->
  <div class="card hidden" id="pool_card">
    <div class="card-title pool-title">
      图片池 <span class="badge" id="pool_count_badge">0 张 · 已选 0</span>
      <span class="pool-title-actions">
        <label class="btn-upload" for="pool_file_input">＋ 上传图片</label>
        <input type="file" id="pool_file_input" accept=".jpg,.jpeg,.png,.webp,.heic,.heif,image/*" multiple hidden>
        <button class="btn-ghost" id="btn_clear_pool" type="button">清空</button>
      </span>
    </div>
    <div class="pool-drop" id="pool_drop">
      拖拽图片到此处,或点击「上传图片」· 支持 JPG / PNG / WEBP / HEIC,单张 ≤ 30MB<br>
      已上传图片本地缓存 file_id,7 天内不重复上传;文生图结果会自动进入图片池
    </div>
    <div class="pool-grid" id="pool_grid"></div>
    <div class="pool-empty" id="pool_empty">图片池为空 — 上传本地图片,或用「文生图」生成后自动进入这里</div>
  </div>

  <!-- 结果 -->
  <div class="card">
    <div class="card-title">结果</div>
    <div class="result" id="result">
      <div class="result-empty">填好参数后点击「生成」,结果会显示在这里</div>
    </div>
  </div>

  <!-- 调用记录 -->
  <div class="card">
    <div class="history-header">
      <div class="card-title" style="margin-bottom:0">调用记录 <span class="badge" id="hist_count_badge">0</span></div>
      <button class="history-clear" id="btn_clear_history">清空记录</button>
    </div>
    <div class="history-list" id="history">
      <div class="history-empty">暂无调用记录</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="models.js"></script>
</body>
</html>
